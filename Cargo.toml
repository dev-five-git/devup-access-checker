[workspace]
resolver = "3"
members = ["crates/devup-access-checker", "crates/devup-access-checker-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dev-five-git/devup-access-checker"

[workspace.dependencies]
devup-access-checker = { path = "crates/devup-access-checker", version = "0.1.0" }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
