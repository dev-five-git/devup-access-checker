[package]
name = "devup-access-checker"
version = "0.0.0"
description = "Collects SEO, GEO and web accessibility signals of a web page and reports what is present or missing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords = ["seo", "geo", "accessibility", "llms-txt", "audit"]
categories = ["web-programming", "development-tools"]
readme = "../../README.md"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip", "brotli"] }
x509-parser = "0.18"
imagesize = "0.15"
scraper = "0.29"
regex = "1"
url = "2"
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio.workspace = true
futures = "0.3"
encoding_rs = "0.8"
flate2 = "1.1.11"

[dev-dependencies]
wiremock = "0.6"
tokio.workspace = true
