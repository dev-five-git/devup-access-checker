# GitHub Actions 와 Cargo 의존성을 주간으로 갱신한다. changepacks/action 은 main 을 따르므로 제외.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "changepacks/action"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    # 호환(minor·patch) 업데이트는 한 PR 로 묶고, 호환이 깨지는 메이저 업데이트는 따로 연다
    groups:
      cargo-compatible:
        update-types: ["minor", "patch"]
