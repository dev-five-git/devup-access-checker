# 서드파티 액션은 메이저 태그(@v7 등)로 고정한다. changepacks/action 은 조직 정책상 main 을 따른다.
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/.gitignore"
  pull_request:
  workflow_dispatch:
    inputs:
      build_cli:
        description: "CLI 5개 플랫폼 빌드만 확인 (업로드·배포 없음)"
        type: boolean
        default: false
  # 매주 최신 의존성으로 빌드·테스트한다 (라이브러리 사용자는 lockfile 없이 최신 호환 버전을 받는다)
  schedule:
    - cron: "0 21 * * 0" # 월요일 06:00 KST

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # 테스트는 로컬 mock 서버(wiremock)만 사용하며 외부 네트워크에 의존하지 않는다.
      - name: Test
        run: cargo test --workspace --all-features

  latest-deps:
    name: test (latest deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Update lockfile to latest compatible versions
        run: cargo update --verbose
      - name: Test
        run: cargo test --workspace --all-features

  # 라인 커버리지 100% 를 유지한다 (미달이면 실패)
  coverage:
    name: coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Coverage
        # llvm 엔진은 CLI 통합 테스트가 실행한 바이너리의 커버리지도 함께 수집한다
        run: cargo tarpaulin --workspace --engine llvm --fail-under 100 --out Xml --out Stdout
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: cobertura.xml

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.88"
      - name: Check
        # rust-toolchain.toml(stable) 보다 우선하도록 +1.88 로 명시한다
        run: cargo +1.88 check --workspace --all-targets

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: package (dry-run publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Dry-run publish
        run: cargo publish --workspace --dry-run

  # main 에 changepack 로그가 들어오면 버전을 올리고 crates.io 에 배포한 뒤 GitHub Release 를 만든다.
  changepacks:
    name: changepacks
    if: github.event_name != 'schedule' && !inputs.build_cli
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - test
      - coverage
      - msrv
      - doc
      - package
    permissions:
      pull-requests: write
      contents: write
    outputs:
      changepacks: ${{ steps.changepacks.outputs.changepacks }}
      release_assets_urls: ${{ steps.changepacks.outputs.release_assets_urls }}
    steps:
      - uses: actions/checkout@v7
      - uses: changepacks/action@main
        id: changepacks
        with:
          publish: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # CLI 가 이번 배포에 포함되면 5개 플랫폼 바이너리를 같은 Release 에 올린다.
  cli-release:
    name: CLI release (${{ matrix.target }})
    needs: changepacks
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'crates/devup-access-checker-cli/Cargo.toml') }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            asset_name: devup-access-checker-linux-x86_64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            # 네이티브 ARM 러너로 빌드한다 (aws-lc-sys 교차 컴파일 회피)
            runs-on: ubuntu-24.04-arm
            asset_name: devup-access-checker-linux-aarch64
            archive: tar.gz
          - target: x86_64-apple-darwin
            # Intel macOS 러너가 없어 ARM 러너에서 교차 빌드한다
            runs-on: macos-latest
            asset_name: devup-access-checker-darwin-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            runs-on: macos-latest
            asset_name: devup-access-checker-darwin-aarch64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            asset_name: devup-access-checker-windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build -p devup-access-checker-cli --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/devup-access-checker" dist/
          strip dist/devup-access-checker 2>/dev/null || true
          cd dist
          tar -czf "${{ matrix.asset_name }}.tar.gz" devup-access-checker
          shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\devup-access-checker.exe" "dist\"
          Compress-Archive -Path "dist\devup-access-checker.exe" -DestinationPath "dist\${{ matrix.asset_name }}.zip"
          $hash = (Get-FileHash "dist\${{ matrix.asset_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.zip" | Out-File -FilePath "dist\${{ matrix.asset_name }}.zip.sha256" -Encoding ascii

      - name: Upload to changepacks release (archive)
        uses: owjs3901/upload-github-release-asset@main
        with:
          upload_url: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['crates/devup-access-checker-cli/Cargo.toml'] }}
          asset_path: dist/${{ matrix.asset_name }}.${{ matrix.archive }}

      - name: Upload to changepacks release (sha256)
        uses: owjs3901/upload-github-release-asset@main
        with:
          upload_url: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['crates/devup-access-checker-cli/Cargo.toml'] }}
          asset_path: dist/${{ matrix.asset_name }}.${{ matrix.archive }}.sha256

  # 수동 실행(build_cli)으로 릴리스 빌드·패키징만 미리 확인한다
  cli-build-check:
    name: CLI build check (${{ matrix.target }})
    if: inputs.build_cli
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            asset_name: devup-access-checker-linux-x86_64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            # 네이티브 ARM 러너로 빌드한다 (aws-lc-sys 교차 컴파일 회피)
            runs-on: ubuntu-24.04-arm
            asset_name: devup-access-checker-linux-aarch64
            archive: tar.gz
          - target: x86_64-apple-darwin
            # Intel macOS 러너가 없어 ARM 러너에서 교차 빌드한다
            runs-on: macos-latest
            asset_name: devup-access-checker-darwin-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            runs-on: macos-latest
            asset_name: devup-access-checker-darwin-aarch64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            asset_name: devup-access-checker-windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build -p devup-access-checker-cli --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/devup-access-checker" dist/
          strip dist/devup-access-checker 2>/dev/null || true
          cd dist
          tar -czf "${{ matrix.asset_name }}.tar.gz" devup-access-checker
          shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\devup-access-checker.exe" "dist\"
          Compress-Archive -Path "dist\devup-access-checker.exe" -DestinationPath "dist\${{ matrix.asset_name }}.zip"
          $hash = (Get-FileHash "dist\${{ matrix.asset_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.zip" | Out-File -FilePath "dist\${{ matrix.asset_name }}.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/
